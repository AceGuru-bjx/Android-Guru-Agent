name: Release (Cross-Repo)

# ═════════════════════════════════════════════════════════════════════════════
# 双仓库发布流水线 —— 开发仓库出代码，发布仓库出产物：
#
#   PR 合并进 main（push main）→ 全自动构建发布，无需再手动打 tag：
#       ├─ 版本号来自 app/build.gradle.kts（PR 里改版本号即发新版）
#       ├─ 版本号未变时自动追加构建序号（v1.4.2 → v1.4.2.1…）
#       │   且 versionCode 自动递增 —— 客户端永远能收到更新
#       └─ 双推防重：`git push origin main vX.Y.Z` 只发一次（同 commit 去重）
#
#   push tag v*.*.*（兼容旧习惯）→ 与 main 触发走同一决策链
#   workflow_dispatch → 干跑：完整构建 + 工件上传，不对外发布
#
#   构建 APK（universal + arm64，复用 apk.yml 的成熟路径）
#       ├─ 生成 version.json（版本 / 下载地址 / SHA-256 / 补丁清单）
#       ├─ 与上一版本生成 xdelta3 增量补丁（App「关于 → 检查更新」可选增量更新）
#       ├─ 累积维护 patches.json 补丁全量索引（App 跨版本链式增量的数据源）
#       └─ 双落点发布（产物在两个仓库都可直接下载）：
#             ├─ 发布仓库 Android-Guru-Agent-Release（跨仓库 PAT RELEASE_REPO_TOKEN）：
#             │     创建 Release + 上传 APK / 补丁 / version.json
#             │     + 提交 version.json 到 main 分支（App 内检查更新读取）
#             └─ 开发仓库 Android-Guru-Agent（默认 GITHUB_TOKEN）：
#                   镜像创建同 tag Release —— 软件在本仓库同样可下载
#
# 设计要点：
#   • 全局串行（concurrency release-pipeline）：发布天然互斥，也保证
#     resolve 阶段的"同 commit 去重"判断不被并发竞态击穿。
#   • 版本决策前置（resolve job）：40 秒内判出版本/跳过，避免 45 分钟
#     构建后才发现重复发布。
#   • 本仓库（dev）只用默认 GITHUB_TOKEN 做只读 checkout —— 跨仓库写操作
#     全部走 PAT。
# ═════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches:
      - main      # PR 合并 / 直推 main → 自动发布
    tags:
      - 'v*.*.*'  # 手动打 tag → 同样发布（兼容既有习惯）
  workflow_dispatch: {}

concurrency:
  # 全局单队列：发布不互相取消，排队串行 —— 决策阶段查重才可靠
  group: release-pipeline
  cancel-in-progress: false

env:
  RELEASE_REPO: AceGuru-mjh/Android-Guru-Agent-Release
  DEV_REPO: AceGuru-mjh/Android-Guru-Agent

jobs:
  # ── 阶段一：版本决策（约 40s）──────────────────────────────────────────────
  # 在长构建之前判出：最终 tag / versionCode / 是否重复发布（skip）
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      vcode: ${{ steps.meta.outputs.vcode }}
      tag: ${{ steps.meta.outputs.tag }}
      sha8: ${{ steps.meta.outputs.sha8 }}
      publishing: ${{ steps.meta.outputs.publishing }}
      skip: ${{ steps.meta.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify release credentials (fail fast)
        if: github.event_name == 'push'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_REPO_TOKEN secret 未配置（Settings → Secrets and variables → Actions）"
            exit 1
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $RELEASE_TOKEN" \
            "https://api.github.com/repos/${RELEASE_REPO}")
          if [ "$CODE" != "200" ]; then
            echo "::error::TOKEN 无法访问 ${RELEASE_REPO}（HTTP $CODE）—— 检查 PAT 仓库授权范围"
            exit 1
          fi
          echo "✅ RELEASE_REPO_TOKEN 可访问发布仓库 ${RELEASE_REPO}"

      - name: Resolve version metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          # 提取模式适配 build.gradle.kts 的 CI 注入语法：
          #   versionName = (project.findProperty("apexVersionName") as String?) ?: "1.4.2"
          #   versionName：行内最后一个带引号串（源码默认值）；versionCode：= 后首个数字
          BASE=$(grep -oP 'versionName\s*=.*"\K[^"]+' app/build.gradle.kts)
          VCODE_GRADLE=$(grep -oP 'versionCode\s*=[^0-9]*\K[0-9]+' app/build.gradle.kts)
          if [ -z "$BASE" ] || [ -z "$VCODE_GRADLE" ]; then
            echo "::error::无法从 app/build.gradle.kts 提取 versionName/versionCode"
            exit 1
          fi
          SHA8=$(echo "${{ github.sha }}" | cut -c1-8)
          PUBLISHING=$([[ "$GITHUB_EVENT_NAME" == "push" ]] && echo true || echo false)
          SKIP=false

          # 上一版 versionCode —— 客户端比对真相源（raw CDN 即 App 检查更新的读取点）
          LAST_VCODE=$(curl -sf -H "Cache-Control: no-cache" \
            "https://raw.githubusercontent.com/${RELEASE_REPO}/main/version.json" \
            2>/dev/null | jq -r '.versionCode // 0' || echo 0)
          [ -n "$LAST_VCODE" ] || LAST_VCODE=0

          release_body() {
            gh api "repos/${RELEASE_REPO}/releases/tags/$1" --jq .body 2>/dev/null || true
          }

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # ── tag 触发：tag 必须与源码 versionName 一致（fail fast）──────
            TAG="$GITHUB_REF_NAME"
            if [ "v$BASE" != "$TAG" ]; then
              echo "::error::tag($TAG) 与 versionName(v$BASE) 不一致 —— 先改 app/build.gradle.kts 再打 tag"
              exit 1
            fi
            VERSION="$BASE"
            # 双推防重：main 队列的 run 可能已发布同 commit（release body 内嵌 sha8）
            if grep -q "$SHA8" <<<"$(release_body "$TAG")"; then
              SKIP=true
              echo "⏭️  ${TAG} 已由同 commit（${SHA8}）的流水线发布 —— 跳过重复构建"
            fi
          elif [ "$PUBLISHING" = true ]; then
            # ── main push（PR 合并/直推）：自动版本决策 ──────────────────────
            TAG="v$BASE"
            VERSION="$BASE"
            if gh api "repos/${RELEASE_REPO}/releases/tags/${TAG}" >/dev/null 2>&1; then
              if grep -q "$SHA8" <<<"$(release_body "$TAG")"; then
                # tag 队列的 run 已/将发布同 commit —— 本 run 无事可做
                SKIP=true
                echo "⏭️  ${TAG} 已由同 commit（${SHA8}）的流水线发布 —— 跳过重复构建"
              else
                # 同版本号重发：自动追加构建序号（v1.4.2 → v1.4.2.1 → …）
                N=1
                while gh api "repos/${RELEASE_REPO}/releases/tags/v${BASE}.${N}" >/dev/null 2>&1; do
                  N=$((N + 1))
                done
                TAG="v${BASE}.${N}"
                VERSION="${BASE}.${N}"
                echo "⚠️  v${BASE} 已被占用 —— 本次自动升级为 ${TAG}"
                echo "::notice::建议在 PR 中更新 app/build.gradle.kts 的 versionName/versionCode"
              fi
            fi
          else
            # ── 干跑（workflow_dispatch）：信息性 tag，不对外发布 ─────────────
            TAG="v$BASE"
            VERSION="$BASE"
          fi

          # versionCode 守卫：绝不回退 —— 忘 bump 时自动 = 上一版 + 1，
          # 保证客户端（versionCode 比对）始终能收到更新
          VCODE="$VCODE_GRADLE"
          if [ "$VCODE" -le "$LAST_VCODE" ]; then
            VCODE=$((LAST_VCODE + 1))
            echo "⚠️  versionCode($VCODE_GRADLE) ≤ 上一版($LAST_VCODE) —— 自动提升为 $VCODE"
          fi

          {
            echo "version=$VERSION"
            echo "vcode=$VCODE"
            echo "sha8=$SHA8"
            echo "tag=$TAG"
            echo "publishing=$PUBLISHING"
            echo "skip=$SKIP"
          } >> "$GITHUB_OUTPUT"
          echo "🏷️  $TAG（versionName=$VERSION versionCode=$VCODE ← gradle $VCODE_GRADLE / 上版 $LAST_VCODE）sha8=$SHA8 publishing=$PUBLISHING skip=$SKIP"

      - name: Summary (resolve)
        if: always()
        run: |
          {
            echo "### 🧭 版本决策"
            echo ""
            echo "- 事件: ${{ github.event_name }} @ ${{ github.ref_name }}"
            echo "- 目标: **${{ steps.meta.outputs.tag }}**（versionCode ${{ steps.meta.outputs.vcode }} · ${{ steps.meta.outputs.sha8 }}）"
            if [ "${{ steps.meta.outputs.skip }}" = "true" ]; then
              echo "- 结论: ⏭️ **跳过**（该版本已由同 commit 的流水线发布，无需重复构建）"
            elif [ "${{ steps.meta.outputs.publishing }}" = "true" ]; then
              echo "- 结论: 🚀 排队进入构建发布"
            else
              echo "- 结论: 🧪 干跑（仅构建与工件，不对外发布）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 阶段二：构建 + 发布（约 10 分钟）──────────────────────────────────────
  build-and-publish:
    name: Build & Publish ${{ needs.resolve.outputs.tag }}
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # 双构建（universal + arm64 各一次 assembleRelease）+ 补丁生成，比 apk.yml 更宽裕
    timeout-minutes: 90
    permissions:
      # 本仓库 Release 镜像发布需要写权限（默认 GITHUB_TOKEN）；
      # 跨仓库（发布仓库）写操作仍全部走 PAT（RELEASE_REPO_TOKEN）
      contents: write
    defaults:
      run:
        # bashisms 依赖：[[ ]] / ${VAR^} / 算术展开 —— runner 默认 sh(dash) 不支持
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure pre-installed Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          # AGP 8.7.3 默认需要 NDK 27.0.12077973，runner 自带 27.3.x
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" >/dev/null 2>&1 || \
          yes | $ANDROID_HOME/tools/bin/sdkmanager "ndk;27.0.12077973" >/dev/null 2>&1 || \
          echo "⚠️ Could not install NDK 27.0.12077973, will try with pre-installed"
          ls "$ANDROID_HOME/ndk/" 2>/dev/null || echo "No NDK pre-installed"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10

      - name: Stage bundled Ubuntu rootfs (T83 内置交付)
        run: |
          # T83/T84：Ubuntu rootfs 随 APK 内置。构建期拉取 → 双重 SHA-256 校验 →
          # 暂存为 jniLibs 伪 .so。失败即阻断构建（绝不打包指纹不符的 rootfs）。
          scripts/fetch_rootfs.sh

      - name: Prewarm dependencies (retry on JitPack flakiness)
        run: |
          attempts=5
          for i in $(seq 1 $attempts); do
            if ./gradlew :app:dependencies \
                --configuration debugCompileClasspath \
                --write-locks \
                --stacktrace; then
              echo "✅ Dependency resolution succeeded on attempt $i"
              exit 0
            fi
            echo "⚠️ Dependency resolution attempt $i failed, retrying..."
            sleep $((i * 30))
          done
          echo "❌ Dependency resolution failed after $attempts attempts"
          exit 1

      # 版本注入：resolve 阶段可能自动追加了构建序号（v1.4.2.1）或提升了
      # versionCode —— 经 Gradle 属性注入最终值，不回写仓库文件（源码保持干净）。
      - name: Build APK (universal + arm64, version injected)
        env:
          FINAL_VERSION: ${{ needs.resolve.outputs.version }}
          FINAL_VCODE: ${{ needs.resolve.outputs.vcode }}
        run: |
          echo "🚀 Building release APKs with versionName=$FINAL_VERSION versionCode=$FINAL_VCODE"
          # 与 apk.yml 相同的双产物路径（中间产物必须停在任务输出目录之外 ——
          # Gradle 重跑 packageRelease 会把输出目录里的非本轮产物当 stale 清理）：
          #   先 universal（含全 3 ABI rootfs，兼容旧设备/模拟器），
          #   再 arm64 纯净包（-PapexAbi 收窄 app 级 abiFilters）。
          ./gradlew ":app:assembleRelease" \
            -PapexVersionName="$FINAL_VERSION" \
            -PapexVersionCode="$FINAL_VCODE" \
            --no-daemon \
            -Pkotlin.incremental=false \
            --stacktrace
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/app-universal-release.apk
          ./gradlew ":app:assembleRelease" \
            -PapexVersionName="$FINAL_VERSION" \
            -PapexVersionCode="$FINAL_VCODE" \
            -PapexAbi=arm64-v8a \
            --no-daemon \
            -Pkotlin.incremental=false \
            --stacktrace
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/app-arm64-release.apk

      - name: Stage artifacts + checksums
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA8: ${{ needs.resolve.outputs.sha8 }}
        run: |
          mkdir -p dist
          mv app/build/outputs/apk/app-arm64-release.apk \
             "dist/ApexAgent-v${VERSION}-release-arm64-${SHA8}.apk"
          mv app/build/outputs/apk/app-universal-release.apk \
             "dist/ApexAgent-v${VERSION}-release-universal-${SHA8}.apk"
          cd dist
          sha256sum ./*.apk | tee SHA256SUMS.apk
          ARM64_MB=$(du -m *arm64*.apk | cut -f1)
          UNI_MB=$(du -m *universal*.apk | cut -f1)
          echo "📦 arm64 — ${ARM64_MB} MB | universal — ${UNI_MB} MB"
          {
            echo "### 📦 发布产物"
            echo ""
            echo "- arm64: **${ARM64_MB} MB**（arm64-v8a，现代手机首选）"
            echo "- universal: **${UNI_MB} MB**（全 3 ABI：旧设备 / 模拟器）"
            echo ""
            echo '```'
            cat SHA256SUMS.apk
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Generate xdelta3 patches (multi-base: recent releases → this release)"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq xdelta3 >/dev/null
          # ── 多基底补丁（v1.4.5：跨任意版本一步直达）────────────────────────
          # 旧方案只对「上一版」出补丁 —— 用户隔两个版本就要走 N 段链式合成
          #（下载量 ×N、合成耗时 ×N）。本方案对最近 PATCH_BASES 个版本各出
          # 一份单跳补丁：窗口内任意版本 → 本版一步到位（rootfs 不变时补丁
          # 体积与相邻版相当，~16MB 级）。窗口外的老版本仍可用 patches.json
          # 的链式路径（多基底边让链也大幅缩短），再老就回退全量包。
          # 正则兼容自动构建序号版（v1.4.2.1）—— 连续合并 PR 未改版本号时，
          # 基底可能是 4 段 tag。
          PATCH_BASES="${PATCH_BASES:-3}"
          list_base_tags() {
            local repo="$1"
            gh api "repos/$repo/releases?per_page=60" --jq '.[].tag_name' 2>/dev/null \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$' | grep -v "^${TAG}$" \
              | head -"$PATCH_BASES" || true
          }
          BASES=$(list_base_tags "$RELEASE_REPO")
          BASE_SRC="${RELEASE_REPO}"
          if [ -z "$BASES" ]; then
            BASES=$(list_base_tags "$DEV_REPO")
            BASE_SRC="${DEV_REPO}"
          fi
          if [ -z "$BASES" ]; then
            echo "⚠️ 未找到历史版本 release —— 跳过补丁生成（首版正常）"
            exit 0
          fi
          # 首个基底 = 上一版（primary：进 version.json 的单补丁档，兼容老客户端）
          PRIMARY_BASE=$(echo "$BASES" | head -1)
          echo "🔗 基底窗口（来源 ${BASE_SRC}，共 $(echo "$BASES" | wc -l) 个）："
          echo "$BASES" | sed 's/^/    - /'
          # meta/ 存内部工作文件（不进 Release 资产）；dist/ 只放对外产物
          # TSV 四列：variant | fromTag | patch 文件名 | primary(1=上一版)
          mkdir -p prev meta
          : > meta/patch_meta.tsv
          for BASE in $BASES; do
            for VARIANT in arm64 universal; do
              NEW_APK=$(ls dist/*-${VARIANT}-*.apk | head -1)
              # 下载基底包 → 出补丁 → 立即删基底（universal ~900MB，磁盘峰值控制）
              rm -f prev/*.apk
              gh release download "$BASE" --repo "$BASE_SRC" \
                --pattern "*-${VARIANT}-*.apk" --dir prev/ --clobber >/dev/null 2>&1 || true
              BASE_APK=$(ls prev/*-${VARIANT}-*.apk 2>/dev/null | head -1 || true)
              if [ -z "$BASE_APK" ]; then
                echo "⚠️ ${BASE} 无 ${VARIANT} 资产 —— 跳过该补丁"
                continue
              fi
              PATCH_NAME="patch_${VARIANT}_${BASE}_to_${TAG}.vcdiff"
              echo "⚙️  xdelta3: ${BASE_APK} + ${NEW_APK} → ${PATCH_NAME}"
              # 显式 -S lzma：与 App 内 VcdiffDecoder 的支持面对齐（Ubuntu 发行版
              # 默认即 lzma，但显式化可免 runner 升级后的行为漂移）；不支持时回退
              # 无二级压缩的原生 VCDIFF（App 同样可解码，体积略大）
              if ! xdelta3 -e -f -S lzma -s "$BASE_APK" "$NEW_APK" "dist/${PATCH_NAME}"; then
                echo "⚠️ -S lzma 不可用（${VARIANT}）—— 回退无二级压缩"
                if ! xdelta3 -e -f -s "$BASE_APK" "$NEW_APK" "dist/${PATCH_NAME}"; then
                  echo "⚠️ xdelta3 失败（${VARIANT}）—— 跳过该补丁"
                  continue
                fi
              fi
              # 补丁体积守卫：> 60% 新包即无意义（rootfs 大改时直接下全量）
              NEW_SIZE=$(stat -c%s "$NEW_APK")
              PATCH_SIZE=$(stat -c%s "dist/${PATCH_NAME}")
              if (( PATCH_SIZE * 10 > NEW_SIZE * 6 )); then
                echo "🗑️  补丁 ${PATCH_SIZE}B > 60% 新包 ${NEW_SIZE}B —— 丢弃（不发布）"
                rm -f "dist/${PATCH_NAME}"
                continue
              fi
              PRIMARY_FLAG=0
              if [ "$BASE" = "$PRIMARY_BASE" ]; then PRIMARY_FLAG=1; fi
              echo -n "${VARIANT}|${BASE}|${PATCH_NAME}|${PRIMARY_FLAG}" >> meta/patch_meta.tsv
              echo "" >> meta/patch_meta.tsv
              echo "✅ ${PATCH_NAME} — $((PATCH_SIZE / 1024 / 1024)) MB（$((PATCH_SIZE * 100 / NEW_SIZE))% of ${VARIANT}）"
            done
          done
          rm -rf prev
          # 补丁说明进 Job Summary
          if [ -s meta/patch_meta.tsv ]; then
            {
              echo ""
              echo "### 🔧 增量补丁（多基底 → ${TAG}）"
              while IFS='|' read -r VARIANT FROM NAME PRIMARY; do
                MARK=""
                if [ "$PRIMARY" = "1" ]; then MARK="（上一版 · primary）"; fi
                echo "- \`${NAME}\` — $(( $(stat -c%s "dist/${NAME}") / 1024 / 1024 )) MB${MARK}"
              done < meta/patch_meta.tsv
              echo ""
              echo "窗口内任意版本可单跳升级到本版；更早版本由 patches.json 链式增量覆盖。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate version.json + release body
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          VCODE: ${{ needs.resolve.outputs.vcode }}
          SHA8: ${{ needs.resolve.outputs.sha8 }}
        run: |
          python3 - <<'PYEOF'
          import datetime, hashlib, json, os

          tag, version, vcode = os.environ["TAG"], os.environ["VERSION"], int(os.environ["VCODE"])
          sha8, repo = os.environ["SHA8"], os.environ["RELEASE_REPO"]
          base = f"https://github.com/{repo}/releases/download/{tag}"

          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()

          def asset(fname):
              return {"url": f"{base}/{fname}",
                      "sizeBytes": os.path.getsize(f"dist/{fname}"),
                      "sha256": sha256(f"dist/{fname}")}

          arm64 = asset(f"ApexAgent-v{version}-release-arm64-{sha8}.apk")
          universal = asset(f"ApexAgent-v{version}-release-universal-{sha8}.apk")

          # 单补丁档只收 primary（上一版 → 本版）——老客户端 schema 兼容；
          # 多基底单跳补丁全部走 patches.json（新客户端按索引直选/短路）。
          patch = None
          if os.path.exists("meta/patch_meta.tsv") and os.path.getsize("meta/patch_meta.tsv") > 0:
              patch = {}
              with open("meta/patch_meta.tsv") as f:
                  for line in f:
                      line = line.strip()
                      if not line:
                          continue
                      parts = line.split("|")
                      # 四列：variant | fromTag | fname | primary（旧三列兼容）
                      variant, from_tag, fname = parts[0], parts[1], parts[2]
                      primary = parts[3] if len(parts) > 3 else "1"
                      if primary != "1":
                          continue
                      patch[variant] = {"fromTag": from_tag,
                                        "url": f"{base}/{fname}",
                                        "sizeBytes": os.path.getsize(f"dist/{fname}"),
                                        "sha256": sha256(f"dist/{fname}")}

          manifest = {
              "versionName": version,
              "versionCode": vcode,
              "tag": tag,
              "publishedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "releasePage": f"https://github.com/{repo}/releases/tag/{tag}",
              "download": {"arm64": arm64, "universal": universal},
              "patch": patch,
          }
          with open("dist/version.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print(json.dumps(manifest, indent=2, ensure_ascii=False))

          # ── Release body（与 version.json 同源，避免两处手抄漂移）──
          # 行列表而非三引号多行串：块标量内 0 列文本会撕裂 YAML 结构。
          # 双落点双份 body：发布仓库（只存产物）与开发仓库（源码主页，镜像发布）。
          mb = lambda a: a["sizeBytes"] / 1024 / 1024
          # 发布页补丁清单：多基底全量列出（文件名即基底信息，用户可辨识）
          patch_lines = "无（首次发布或 rootfs 大改）"
          if os.path.exists("meta/patch_meta.tsv") and os.path.getsize("meta/patch_meta.tsv") > 0:
              rows = []
              with open("meta/patch_meta.tsv") as f:
                  for line in f:
                      line = line.strip()
                      if not line:
                          continue
                      parts = line.split("|")
                      variant, from_tag, fname = parts[0], parts[1], parts[2]
                      size_mb = os.path.getsize(f"dist/{fname}") // 1024 // 1024
                      rows.append(f"- `{variant}`: {from_tag} → {tag} — {size_mb} MB（xdelta3 VCDIFF）")
              if rows:
                  patch_lines = "\n".join(rows)

          def release_body(header_note):
              return "\n".join([
                  f"## Apex Agent {tag}",
                  "",
                  header_note,
                  "",
                  "### 📦 下载（选适合你设备的）",
                  "| 变体 | 适用 | 体积 |",
                  "| --- | --- | --- |",
                  f"| `arm64` | 现代手机（arm64-v8a，**首选**） | {mb(arm64):.0f} MB |",
                  f"| `universal` | 旧设备 / 模拟器（全 3 ABI） | {mb(universal):.0f} MB |",
                  "",
                  "### 🔧 增量补丁（App 内「关于 → 检查更新」可直选）",
                  patch_lines,
                  "",
                  "应用方式：App 内「关于 → 检查更新」下载补丁后**自动合成并拉起安装**",
                  "（v1.4.5+ 内置 VCDIFF 解码器，无需命令行；窗口内版本单跳直达，",
                  "更早版本自动链式应用）。",
                  "",
                  "### 📋 版本清单",
                  "`version.json` —— App 内「关于 → 检查更新」即读取此文件（含 SHA-256 校验）。",
                  "",
                  "> Ubuntu 24.04 完整 CLI 环境随 APK 内置 —— 首次离线解包约 2~5 分钟，零网络。",
                  f"> 提交：`{os.environ['SHA8']}` · versionCode：`{vcode}`",
                  "",
              ])

          body = release_body(
              "> 开发仓库合并 PR / 打 tag 自动构建，跨仓库 PAT 自动发布 —— 本仓库只存产物，\n"
              f"> 源码见 https://github.com/AceGuru-mjh/Android-Guru-Agent/tree/{tag}")
          body_dev = release_body(
              "> 本 Release 由流水线自动构建发布（PR 合并 / 打 tag 触发）。\n"
              f"> 产物与增量补丁的主存放处：https://github.com/{repo} —— App 内更新检查固定读取发布仓库。")

          with open("release_body.md", "w", encoding="utf-8") as f:
              f.write(body)
          with open("release_body_dev.md", "w", encoding="utf-8") as f:
              f.write(body_dev)
          PYEOF
          cat release_body.md

      - name: Generate patches.json (cumulative patch index)
        if: needs.resolve.outputs.publishing == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # 拉取现有索引（首版 / 历史缺失时从空开始）—— 跨版本链式增量的数据底座：
          # App 由此把「本地版本 → 最新版本」解析成补丁链逐段应用
          export EXISTING_JSON=""
          if EXISTING_RAW=$(gh api "repos/${RELEASE_REPO}/contents/patches.json?ref=main" \
              --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d 2>/dev/null); then
            export EXISTING_JSON="$EXISTING_RAW"
            echo "📥 已拉取现有补丁索引（$(echo "$EXISTING_RAW" | jq '.patches | length') 条）"
          else
            echo "🆕 无现有 patches.json —— 从零构建"
          fi
          python3 - <<'PYEOF'
          import base64, datetime, hashlib, json, os

          tag, repo = os.environ["TAG"], os.environ["RELEASE_REPO"]
          existing = os.environ.get("EXISTING_JSON", "")
          patches = []
          if existing:
              try:
                  patches = json.loads(existing).get("patches", [])
              except Exception:
                  patches = []

          base = f"https://github.com/{repo}/releases/download/{tag}"

          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()

          added = 0
          if os.path.exists("meta/patch_meta.tsv"):
              with open("meta/patch_meta.tsv") as f:
                  for line in f:
                      line = line.strip()
                      if not line:
                          continue
                      parts = line.split("|")
                      # 四列：variant | fromTag | fname | primary（旧三列兼容）
                      variant, from_tag, fname = parts[0], parts[1], parts[2]
                      # 幂等守卫：同 (variant, fromTag, toTag) 不重复追加
                      #（多基底补丁也在此索引累积 —— 窗口内任意版本单跳直达）
                      dup = any(
                          p.get("variant") == variant and
                          p.get("fromTag") == from_tag and
                          p.get("toTag") == tag
                          for p in patches
                      )
                      if dup:
                          continue
                      patches.append({
                          "variant": variant,
                          "fromTag": from_tag,
                          "toTag": tag,
                          "url": f"{base}/{fname}",
                          "sizeBytes": os.path.getsize(f"dist/{fname}"),
                          "sha256": sha256(f"dist/{fname}"),
                      })
                      added += 1

          manifest = {
              "generatedAt": datetime.datetime.now(datetime.timezone.utc)
                  .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "latestTag": tag,
              "patches": patches,
          }
          with open("dist/patches.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print(f"📦 patches.json：共 {len(patches)} 条（本次新增 {added}）")
          PYEOF

      - name: Upload workflow artifacts (backup / dry-run output)
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-${{ needs.resolve.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish Release to release repository
        if: needs.resolve.outputs.publishing == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # 关键：目标为发布仓库（owner/repo），token 为跨仓库 PAT —— 默认
          # GITHUB_TOKEN 无跨仓库权限。tag 由 action 在目标仓库自动创建。
          repository: ${{ env.RELEASE_REPO }}
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: "Release ${{ needs.resolve.outputs.tag }}"
          body_path: release_body.md
          make_latest: true
          files: dist/*

      - name: Mirror Release to dev repository (主仓库同步发布，仅 APK)
        if: needs.resolve.outputs.publishing == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # 主仓库镜像发布：不指定 repository / token → 默认本仓库 + GITHUB_TOKEN。
          # 防回环关键：GITHUB_TOKEN 产生的事件（tag/release 创建）不会触发新的
          # workflow run —— 若此处改用 PAT，创建的 tag 会以 push 事件再次点燃
          # 本流水线的 tags 触发器，形成死循环。
          # v1.4.5 职责收紧：主仓库只镜像 APK + SHA 清单 + version.json ——
          # 增量补丁（*.vcdiff）与补丁索引（patches.json）只放发布仓库，
          # App 下载补丁固定走发布仓库直链（version.json/patches.json 的 URL
          # 均指向 RELEASE_REPO）。dist/ 的补丁文件绝不进入主仓库。
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: "Release ${{ needs.resolve.outputs.tag }}"
          body_path: release_body_dev.md
          make_latest: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.apk
            dist/version.json

      - name: Commit version.json to release repo main branch
        if: needs.resolve.outputs.publishing == 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA8: ${{ needs.resolve.outputs.sha8 }}
        run: |
          # raw.githubusercontent.com 版本清单 —— App 内检查更新的固定读取点
          git clone --depth 1 \
            "https://x-access-token:${RELEASE_TOKEN}@github.com/${RELEASE_REPO}.git" relrepo
          cp dist/version.json relrepo/version.json
          # 补丁全量索引与版本清单同源提交 —— App 跨版本链式增量依赖此文件
          if [ -f dist/patches.json ]; then
            cp dist/patches.json relrepo/patches.json
          fi
          cd relrepo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json patches.json
          git commit -m "chore: version.json + patches.json → ${TAG}（dev repo ${SHA8}）"
          git push origin main
          echo "✅ https://raw.githubusercontent.com/${RELEASE_REPO}/main/version.json 已更新"
          echo "✅ https://raw.githubusercontent.com/${RELEASE_REPO}/main/patches.json 已更新"

      - name: Summary
        if: always()
        run: |
          {
            echo "### 🚀 发布状态"
            echo ""
            if [ "${{ needs.resolve.outputs.publishing }}" = "true" ]; then
              echo "- 流水线: **正式发布**（${{ needs.resolve.outputs.tag }}）"
              echo "- 产物页: https://github.com/${RELEASE_REPO}/releases/tag/${{ needs.resolve.outputs.tag }}"
              echo "- 主仓库镜像: https://github.com/${DEV_REPO}/releases/tag/${{ needs.resolve.outputs.tag }}"
              echo "- 版本清单: https://raw.githubusercontent.com/${RELEASE_REPO}/main/version.json"
              echo "- 客户端: App「关于 → 检查更新」即收到本版（支持增量补丁 + 镜像加速）"
            else
              echo "- 流水线: **干跑**（workflow_dispatch —— 仅构建与工件，未对外发布）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
